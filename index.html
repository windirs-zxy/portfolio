<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集 for windirs-zxy </title>
<style>
  :root{
    --bg:#f4f2ee;
    --bg2:#e9e5dd;
    --panel:#ffffff;
    --ink:#171614;
    --ink2:#57534c;
    --ink3:#8b857c;
    --line:#e2ded5;
    --accent:#b1462c;
    --accent-soft:#f6e9e4;
    --ease:cubic-bezier(.22,.61,.36,1);
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  button{font:inherit}

  /* ================= 开场 ================= */
  .intro{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .6s ease;
    cursor:pointer;
  }
  .intro.gone{opacity:0;pointer-events:none}
  .intro-stage{text-align:center;will-change:transform,opacity}
  .intro-kicker{
    font-size:11px;letter-spacing:.34em;color:var(--ink3);
    margin-bottom:24px;
    opacity:0;animation:dropIn .8s var(--ease) .1s both;
  }
  .intro-name{
    font-size:clamp(46px,8.5vw,88px);
    font-weight:650;letter-spacing:-.02em;margin:0;line-height:1.1;
    opacity:0;animation:dropIn .9s var(--ease) .25s both;
  }
  .intro-rule{
    height:1px;background:var(--line);margin:28px auto;
    width:0;animation:grow .8s var(--ease) .7s both;
  }
  .intro-sub{
    font-size:15px;color:var(--ink2);margin:0 0 8px;
    opacity:0;animation:dropIn .8s var(--ease) .5s both;
  }
  .intro-line{
    font-size:13px;color:var(--ink3);margin:0;letter-spacing:.02em;
    opacity:0;animation:dropIn .8s var(--ease) .68s both;
  }
  .intro-hint{
    position:absolute;bottom:36px;left:0;right:0;text-align:center;
    font-size:12px;color:var(--ink3);letter-spacing:.12em;
    opacity:0;animation:fadeIn .6s ease 1.5s both;
  }
  @keyframes dropIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
  @keyframes grow{from{width:0;opacity:0}to{width:130px;opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes cardIn{from{opacity:0;transform:translateY(-38px)}to{opacity:1;transform:none}}

  /* ================= 主界面 ================= */
  .app{
    max-width:1300px;margin:0 auto;
    padding:42px 30px 90px;
    display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:38px;
    align-items:start;
    opacity:0;
  }
  .app.ready{opacity:1}

  .main{min-width:0}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.16em;color:var(--ink3)}
  .brand-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  .search{
    display:flex;align-items:center;gap:9px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:8px 13px;min-width:250px;
  }
  .search-ico{color:var(--ink3);font-size:15px}
  .search input{
    border:0;outline:0;background:transparent;flex:1;color:var(--ink);
    font:inherit;font-size:13px;min-width:120px;
  }
  .search input::placeholder{color:var(--ink3)}

  /* 分类导航 */
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
  .cat{
    display:flex;align-items:center;gap:7px;
    padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);
    font-size:13px;color:var(--ink2);cursor:pointer;
    transition:transform .2s var(--ease),background .2s,border-color .2s,color .2s;
    opacity:0;
  }
  .app.ready .cat{animation:dropIn .52s var(--ease) both;animation-delay:var(--d,0ms)}
  .cat:hover{border-color:#d5cec1;color:var(--ink);transform:translateY(-2px)}
  .cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .cat .ico{font-size:14px;line-height:1}
  .cat .n{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .cat.on .n{color:rgba(255,255,255,.6)}

  .crumb{display:flex;align-items:baseline;gap:10px;margin:0 0 16px}
  .crumb h2{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
  .crumb span{font-size:12.5px;color:var(--ink3)}

  /* 作品卡片 */
  .works{display:grid;gap:14px;transition:opacity .24s ease,transform .24s ease}
  .works.fading{opacity:0;transform:translateY(-16px)}
  .work{
    display:grid;grid-template-columns:232px minmax(0,1fr);
    background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;cursor:pointer;outline:none;
    box-shadow:0 1px 2px rgba(23,22,20,.03);
    transition:transform .38s var(--ease),box-shadow .38s var(--ease),border-color .3s;
    opacity:0;
  }
  .app.ready .work{animation:cardIn .62s var(--ease) both;animation-delay:var(--d,0ms)}
  .work:hover,.work:focus-visible{
    transform:translateY(-4px) scale(1.008);
    border-color:#d6cfc2;
    box-shadow:0 22px 44px -26px rgba(23,22,20,.42);
  }
  .cover{position:relative;background:var(--bg2);overflow:hidden;min-height:148px}
  .cover img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transition:transform .7s var(--ease);
  }
  .work:hover .cover img{transform:scale(1.09)}
  .cover-mask{
    position:absolute;inset:0;background:rgba(23,22,20,.46);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12.5px;letter-spacing:.14em;
    opacity:0;transition:opacity .3s ease;
  }
  .work:hover .cover-mask{opacity:1}
  .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:16px;color:var(--ink3);font-size:11.5px;line-height:1.6;
  }
  .ph b{display:block;color:var(--ink2);font-size:12.5px;margin-bottom:5px}
  .body{padding:17px 20px;display:flex;flex-direction:column;justify-content:center}
  .title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .title-row h3{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .badge{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--ink2);font-weight:500}
  .badge.sample{background:var(--accent-soft);color:var(--accent)}
  .summary{
    margin:0 0 11px;color:var(--ink2);font-size:13.5px;line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{
    font-size:11.5px;padding:1px 9px;border-radius:20px;
    background:var(--bg);border:1px solid var(--line);color:var(--ink2);
  }
  .empty{
    background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);
    padding:56px 20px;text-align:center;color:var(--ink3);font-size:14px;
  }
  .foot{margin-top:40px;text-align:center;color:var(--ink3);font-size:12px;letter-spacing:.08em}

  /* ================= 作者卡 ================= */
  .profile{position:sticky;top:32px}
  .pcard{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:22px;
    box-shadow:0 1px 2px rgba(23,22,20,.04),0 26px 48px -36px rgba(23,22,20,.38);
    opacity:0;transition:opacity .5s ease .5s;
  }
  .app.ready .pcard{opacity:1}
  .avatar{
    width:82px;height:82px;border-radius:50%;overflow:hidden;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:600;margin-bottom:16px;position:relative;
  }
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pname{font-size:20px;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}
  .ptitle{font-size:12.5px;color:var(--accent);margin:0 0 14px;letter-spacing:.02em}
  .pbio{font-size:13.5px;color:var(--ink2);margin:0 0 16px;line-height:1.7}
  .stats{display:flex;gap:22px}
  .stats b{display:block;font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
  .stats span{font-size:12px;color:var(--ink3)}
  .psec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .psec h4{font-size:10.5px;letter-spacing:.16em;color:var(--ink3);margin:0 0 9px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
  .rows div{display:flex;gap:8px;padding:3px 0;font-size:13px;color:var(--ink2)}
  .rows span:first-child{color:var(--ink3);flex:0 0 46px}
  .rows a{border-bottom:1px solid var(--line);transition:border-color .15s,color .15s}
  .rows a:hover{border-color:var(--accent);color:var(--accent)}

  /* ================= 详情弹层 ================= */
  .detail{
    position:fixed;inset:0;z-index:200;
    display:flex;align-items:center;justify-content:center;padding:26px;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .detail.open{opacity:1;pointer-events:auto}
  .detail-mask{
    position:absolute;inset:0;background:rgba(23,22,20,.55);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .detail-shell{
    position:relative;width:min(1060px,100%);max-height:calc(100vh - 52px);
    background:var(--bg);border-radius:20px;overflow:hidden;
    display:flex;flex-direction:column;
    transform:scale(.965) translateY(14px);
    transition:transform .42s var(--ease);
    box-shadow:0 40px 90px -40px rgba(0,0,0,.55);
  }
  .detail.open .detail-shell{transform:none}
  .detail-close{
    position:absolute;top:14px;right:14px;z-index:3;
    width:36px;height:36px;border-radius:50%;border:0;
    background:rgba(255,255,255,.92);color:var(--ink);
    font-size:20px;line-height:1;cursor:pointer;
    transition:transform .2s,background .2s;
  }
  .detail-close:hover{transform:rotate(90deg);background:#fff}
  .detail-grid{display:grid;grid-template-columns:1.22fr 1fr;overflow:auto}
  .detail-media{background:#141312;position:relative;min-height:360px;display:flex;align-items:center;justify-content:center}
  .detail-media img{width:100%;height:100%;object-fit:cover;max-height:440px}
  .detail-empty{color:#8b857c;text-align:center;font-size:14px;line-height:1.9;padding:40px}
  .detail-empty span{font-size:12px;color:#5c5852}
  .detail-info{padding:28px 30px 32px;overflow:auto}
  .detail-info h2{margin:0 0 10px;font-size:25px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
  .d-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 18px;font-size:12.5px;color:var(--ink3)}
  .d-meta .badge{font-size:11px}
  .d-sum{margin:0 0 16px;font-size:14.5px;color:var(--ink2);line-height:1.8}
  .d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  .d-flow h4{font-size:10.5px;letter-spacing:.16em;color:var(--ink3);margin:0 0 12px;font-weight:600}
  .d-flow ol{margin:0;padding:0;list-style:none;counter-reset:s}
  .d-flow li{
    counter-increment:s;position:relative;
    padding:0 0 11px 28px;font-size:13.5px;color:var(--ink2);
  }
  .d-flow li:last-child{padding-bottom:0}
  .d-flow li::before{
    content:counter(s);position:absolute;left:0;top:1px;
    width:19px;height:19px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);
    font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
  }
  .d-flow li::after{
    content:"";position:absolute;left:9px;top:22px;bottom:3px;
    width:1px;background:var(--line);
  }
  .d-flow li:last-child::after{display:none}
  .d-link{
    display:inline-block;margin-top:26px;padding:10px 22px;border-radius:10px;
    background:var(--ink);color:#fff;font-size:13.5px;letter-spacing:.04em;
    transition:transform .2s var(--ease),background .2s;
  }
  .d-link:hover{transform:translateY(-2px);background:var(--accent)}
  .d-nav{display:flex;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  .d-nav button{
    flex:1;padding:9px 14px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;
    transition:all .2s;
  }
  .d-nav button:hover{border-color:#d5cec1;color:var(--ink);background:#fff}
  body.locked{overflow:hidden}

  /* ================= 响应式 ================= */
  @media (max-width:1120px){
    .app{grid-template-columns:minmax(0,1fr);padding:30px 22px 64px;gap:24px}
    .profile{position:static;order:-1}
    .detail-grid{grid-template-columns:1fr}
    .detail-media{min-height:220px}
    .detail-media img{max-height:260px}
  }
  @media (max-width:700px){
    .topbar{flex-direction:column;align-items:stretch;gap:12px}
    .search{min-width:0}
    .work{grid-template-columns:1fr}
    .cover{min-height:176px;border-bottom:1px solid var(--line)}
    .detail{padding:0}
    .detail-shell{max-height:100vh;border-radius:0}
  }
  .noanim *{animation:none!important;transition:none!important}
  .noanim .work,.noanim .cat,.noanim .pcard{opacity:1!important}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important}
  }
</style>
</head>

var state = { cat: "all", q: "", idx: -1 };
var $ = function(id){ return document.getElementById(id); };
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function byId(id){
  for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
  return null;
}
function counts(){
  var m = {};
  WORKS.forEach(function(w){ m[w.cat] = (m[w.cat] || 0) + 1; });
  return m;
}

/* ---------- 作者卡 ---------- */
function renderProfile(){
  var av = PROFILE.avatar
    ? '<img src="' + esc(PROFILE.avatar) + '" alt="' + esc(PROFILE.name) + '" onerror="this.remove()">'
    : esc(String(PROFILE.name).slice(0, 1));
  var used = CATEGORIES.filter(function(k){ return counts()[k.id]; }).length;
  var chips = (PROFILE.skills || []).map(function(s){
    return '<span class="chip">' + esc(s) + '</span>'; }).join("");
  var rows = (PROFILE.contact || []).filter(function(c){ return c.v; }).map(function(c){
    var v = c.href
      ? '<a href="' + esc(c.href) + '" target="_blank" rel="noopener">' + esc(c.v) + '</a>'
      : esc(c.v);
    return '<div><span>' + esc(c.k) + '</span><span>' + v + '</span></div>';
  }).join("");

  $("profile").innerHTML =
    '<div class="pcard">' +
      '<div class="avatar">' + av + '</div>' +
      '<h3 class="pname">' + esc(PROFILE.name) + '</h3>' +
      '<p class="ptitle">' + esc(PROFILE.title) + '</p>' +
      '<p class="pbio">' + esc(PROFILE.bio) + '</p>' +
      '<div class="stats">' +
        '<div><b>' + WORKS.length + '</b><span>件作品</span></div>' +
        '<div><b>' + used + '</b><span>个分类</span></div>' +
      '</div>' +
      '<div class="psec"><h4>技能</h4><div class="chips">' + chips + '</div></div>' +
      (rows ? '<div class="psec"><h4>联系</h4><div class="rows">' + rows + '</div></div>' : '') +
    '</div>';
}

/* ---------- 分类导航 ---------- */
var catsBuilt = false;
function renderCats(){
  if (catsBuilt) {
    Array.prototype.forEach.call($("cats").querySelectorAll(".cat"), function(b){
      b.classList.toggle("on", b.getAttribute("data-cat") === state.cat);
    });
    return;
  }
  var c = counts();
  var html = '<button class="cat' + (state.cat === "all" ? " on" : "") +
    '" data-cat="all" style="--d:0ms"><span class="ico">🗂️</span>' +
    '<span>全部</span><span class="n">' + WORKS.length + '</span></button>';
  CATEGORIES.forEach(function(k, i){
    html += '<button class="cat' + (state.cat === k.id ? " on" : "") +
      '" data-cat="' + k.id + '" style="--d:' + ((i + 1) * 52) + 'ms">' +
      '<span class="ico">' + k.ico + '</span><span>' + esc(k.name) + '</span>' +
      '<span class="n">' + (c[k.id] || 0) + '</span></button>';
  });
  $("cats").innerHTML = html;
  catsBuilt = true;
  Array.prototype.forEach.call($("cats").querySelectorAll(".cat"), function(b){
    b.onclick = function(){ state.cat = b.getAttribute("data-cat"); renderCats(); renderWorks(true); };
  });
}

/* ---------- 作品列表 ---------- */
function match(w){
  if (state.cat !== "all" && w.cat !== state.cat) return false;
  if (!state.q) return true;
  var k = byId(w.cat);
  var hay = [w.title, w.summary, w.year, w.role,
             (w.tags || []).join(" "), (w.workflow || []).join(" "),
             k ? k.name : ""].join(" ").toLowerCase();
  return hay.indexOf(state.q.toLowerCase()) >= 0;
}

function cardHTML(w, i){
  var k = byId(w.cat);
  var ph = '<div class="ph"><b>' + esc(w.title) + '</b>' +
    (k ? esc(k.name) : "") + '<br>' +
    (w.cover ? "封面加载失败" : "暂无封面") + '</div>';
  var img = w.cover
    ? '<img src="' + esc(w.cover) + '" alt="' + esc(w.title) + '" loading="lazy" onerror="this.remove()">'
    : '';
  return '<article class="work" data-i="' + i + '" tabindex="0" style="--d:' + (i * 46 + 170) + 'ms">' +
      '<div class="cover">' + ph + img + '<div class="cover-mask">查看详情 →</div></div>' +
      '<div class="body">' +
        '<div class="title-row"><h3>' + esc(w.title) + '</h3>' +
          (w.sample ? '<span class="badge sample">示例</span>' : '') +
          (k ? '<span class="badge">' + esc(k.name) + '</span>' : '') +
        '</div>' +
        '<p class="summary">' + esc(w.summary) + '</p>' +
        '<div class="tags">' + (w.tags || []).map(function(t){
          return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' +
      '</div>' +
    '</article>';
}

function renderWorks(animate){
  var list = WORKS.filter(match);
  var k = byId(state.cat);
  $("crumbTitle").textContent = state.q ? "搜索结果" :
    (state.cat === "all" ? "全部作品" : (k ? k.name : "作品"));
  $("crumbMeta").textContent = "共 " + list.length + " 件" +
    (k && !state.q ? " · " + k.desc : "");

  var panel = $("works");
  var paint = function(){
    panel.innerHTML = list.length
      ? list.map(function(w){ return cardHTML(w, WORKS.indexOf(w)); }).join("")
      : '<div class="empty">这个分类下还没有作品。</div>';
    Array.prototype.forEach.call(panel.querySelectorAll(".work"), function(el){
      var open = function(){ openDetail(parseInt(el.getAttribute("data-i"), 10)); };
      el.onclick = open;
      el.onkeydown = function(e){
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      };
    });
    panel.classList.remove("fading");
  };

  if (animate && panel.children.length){
    panel.classList.add("fading");
    setTimeout(paint, 240);
  } else {
    paint();
  }
}

/* ---------- 详情弹层 ---------- */
function openDetail(i){
  var w = WORKS[i];
  if (!w) return;
  state.idx = i;
  var k = byId(w.cat);

  $("detailMedia").innerHTML = w.cover
    ? '<img src="' + esc(w.cover) + '" alt="' + esc(w.title) + '">'
    : '<div class="detail-empty">' + esc(w.title) + '<br><span>暂无封面图</span></div>';

  var flow = (w.workflow || []).length
    ? '<div class="d-flow"><h4>工作流</h4><ol>' + w.workflow.map(function(s){
        return '<li>' + esc(s) + '</li>'; }).join("") + '</ol></div>'
    : '';

  $("detailInfo").innerHTML =
    '<h2>' + esc(w.title) + '</h2>' +
    '<div class="d-meta">' +
      '<span>' + esc(w.year) + '</span>' +
      '<span>' + esc(w.role) + '</span>' +
      (k ? '<span class="badge">' + esc(k.name) + '</span>' : '') +
      (w.sample ? '<span class="badge sample">示例</span>' : '') +
    '</div>' +
    '<p class="d-sum">' + esc(w.summary) + '</p>' +
    '<div class="d-tags">' + (w.tags || []).map(function(t){
      return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' +
    flow +
    (w.link ? '<a class="d-link" href="' + esc(w.link) + '" target="_blank" rel="noopener">查看作品 ↗</a>' : '') +
    '<div class="d-nav">' +
      '<button id="dPrev">← 上一个</button>' +
      '<button id="dNext">下一个 →</button>' +
    '</div>';

  $("dPrev").onclick = function(){ step(-1); };
  $("dNext").onclick = function(){ step(1); };

  $("detail").classList.add("open");
  $("detail").setAttribute("aria-hidden", "false");
  document.body.classList.add("locked");
}

function step(d){
  var n = state.idx + d;
  if (n < 0) n = WORKS.length - 1;
  if (n >= WORKS.length) n = 0;
  openDetail(n);
}

function closeDetail(){
  $("detail").classList.remove("open");
  $("detail").setAttribute("aria-hidden", "true");
  document.body.classList.remove("locked");
}

/* ---------- 开场动画 ---------- */
var introDone = false;

function finishIntro(){
  if (introDone) return;
  introDone = true;
  $("app").classList.add("ready");
  $("intro").classList.add("gone");
  setTimeout(function(){ $("intro").style.display = "none"; }, 650);
}

function playIntro(){
  if (location.search.indexOf("skip") >= 0) {
    document.body.classList.add("noanim");
    $("intro").style.display = "none";
    finishIntro();
    return;
  }
  if (reduce) { $("intro").style.display = "none"; finishIntro(); return; }

  setTimeout(function(){
    var stage = $("introStage");
    var card = document.querySelector(".pcard");
    if (!stage || !card) { finishIntro(); return; }
    var from = stage.getBoundingClientRect();
    var to = card.getBoundingClientRect();
    if (!to.width || !from.width) { finishIntro(); return; }
    var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    var dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    var s = Math.min(to.width / from.width, 1);
    stage.style.transition = "transform .88s cubic-bezier(.22,.61,.36,1), opacity .45s ease .42s";
    stage.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
    stage.style.opacity = "0";
    setTimeout(finishIntro, 920);
  }, 1350);
}

/* ---------- 事件 ---------- */
var q = $("q");
q.oninput = function(){ state.q = q.value.trim(); renderWorks(); };
document.addEventListener("keydown", function(e){
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); return; }
  if (e.key === "Escape"){
    if ($("detail").classList.contains("open")) { closeDetail(); return; }
    if (document.activeElement === q) { q.value = ""; state.q = ""; q.blur(); renderWorks(); }
    return;
  }
  if ($("detail").classList.contains("open")){
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  }
});
$("detailMask").onclick = closeDetail;
$("detailClose").onclick = closeDetail;
$("intro").onclick = finishIntro;

/* ---------- 启动 ---------- */
renderProfile();
$("introName").textContent = PROFILE.name;
renderCats();
renderWorks();
playIntro();

var m = location.search.match(/open=(\d+)/);
if (m) { setTimeout(function(){ openDetail(parseInt(m[1], 10)); }, 80); }

})();
</script>
