<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集 · 张潇阳</title>
<style>
  :root{
    --bg:#f7f6f3;
    --panel:#ffffff;
    --ink:#1c1b19;
    --ink-2:#5c5852;
    --ink-3:#8d8880;
    --line:#e6e2da;
    --line-2:#f0ede7;
    --accent:#b1462c;
    --accent-soft:#f6e9e4;
    --radius:14px;
    --shadow:0 1px 2px rgba(28,27,25,.04), 0 8px 24px -12px rgba(28,27,25,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  /* ---------- 布局：左分类 / 中作品 / 右作者 ---------- */
  .layout{
    max-width:1440px;
    margin:0 auto;
    padding:32px 28px 64px;
    display:grid;
    grid-template-columns:222px minmax(0,1fr) 320px;
    gap:26px;
    align-items:start;
  }

  /* ---------- 左侧分类 ---------- */
  .nav{position:sticky;top:28px}
  .nav-title{
    font-size:12px;letter-spacing:.16em;color:var(--ink-3);
    margin:0 0 14px;font-weight:600;
  }
  .cat{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;
    padding:9px 12px;margin-bottom:3px;
    border:1px solid transparent;border-radius:9px;
    background:transparent;color:var(--ink-2);
    font:inherit;font-size:14px;cursor:pointer;
    transition:background .16s,color .16s,border-color .16s;
  }
  .cat:hover{background:var(--panel);color:var(--ink);border-color:var(--line)}
  .cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cat .ico{font-size:15px;line-height:1;width:18px;text-align:center;flex:0 0 auto}
  .cat .nm{flex:1}
  .cat .n{
    font-size:12px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;flex:0 0 auto;
  }
  .cat.on .n{color:rgba(255,255,255,.65)}

  /* ---------- 中间作品区 ---------- */
  .head{margin-bottom:20px}
  .head h1{
    font-size:26px;margin:0 0 6px;letter-spacing:-.01em;font-weight:650;
  }
  .head p{margin:0;color:var(--ink-2);font-size:14px}
  .searchbar{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:9px 14px;margin:16px 0 6px;
  }
  .searchbar input{
    border:0;outline:0;background:transparent;font:inherit;flex:1;color:var(--ink);
  }
  .searchbar input::placeholder{color:var(--ink-3)}
  .searchbar .k{
    font-size:11px;color:var(--ink-3);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;font-family:ui-monospace,monospace;
  }
  .crumb{
    display:flex;align-items:baseline;gap:10px;
    margin:22px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .crumb h2{font-size:18px;margin:0;font-weight:650}
  .crumb span{font-size:13px;color:var(--ink-3)}
  .crumb .d{color:var(--ink-2);font-size:13px}

  .works{display:grid;gap:16px}
  .work{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
    animation:in .28s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .work-top{display:grid;grid-template-columns:212px minmax(0,1fr);gap:0}
  .cover{
    position:relative;background:#eceae4;
    border-right:1px solid var(--line-2);
    min-height:150px;display:flex;align-items:center;justify-content:center;
  }
  .cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .cover .ph{
    font-size:12px;color:var(--ink-3);text-align:center;padding:14px;line-height:1.5;
  }
  .cover .ph b{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
  .work-body{padding:16px 18px}
  .work h3{
    margin:0 0 6px;font-size:16.5px;font-weight:650;letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .badge{
    font-size:11px;font-weight:500;color:var(--accent);
    background:var(--accent-soft);border-radius:5px;padding:1px 6px;
    letter-spacing:.02em;
  }
  .badge.cat{
    color:var(--ink-2);background:var(--line-2);
  }
  .summary{margin:0 0 10px;color:var(--ink-2);font-size:14px}
  .metas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
  .metas b{color:var(--ink-2);font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
  .tag{
    font-size:11.5px;color:var(--ink-2);background:var(--bg);
    border:1px solid var(--line);border-radius:20px;padding:1px 9px;
  }
  .flow{
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  }
  .flow-h{
    font-size:11px;letter-spacing:.14em;color:var(--ink-3);
    font-weight:600;margin-bottom:8px;
  }
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{
    counter-increment:s;position:relative;
    padding:0 0 9px 26px;font-size:13.5px;color:var(--ink-2);
  }
  .steps li:last-child{padding-bottom:0}
  .steps li::before{
    content:counter(s);
    position:absolute;left:0;top:1px;
    width:17px;height:17px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);
    font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;
    display:flex;align-items:center;justify-content:center;
  }
  .steps li::after{
    content:"";position:absolute;left:8px;top:20px;bottom:2px;
    width:1px;background:var(--line);
  }
  .steps li:last-child::after{display:none}
  .empty{
    background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
    padding:44px 20px;text-align:center;color:var(--ink-3);font-size:14px;
  }

  /* ---------- 右侧作者卡 ---------- */
  .profile{position:sticky;top:28px}
  .pcard{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);
  }
  .avatar{
    width:78px;height:78px;border-radius:50%;overflow:hidden;
    background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:600;letter-spacing:.02em;
    margin-bottom:14px;position:relative;
  }
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pname{font-size:19px;font-weight:650;margin:0 0 3px}
  .ptitle{font-size:12.5px;color:var(--accent);margin:0 0 14px;letter-spacing:.02em}
  .pbio{font-size:13.5px;color:var(--ink-2);margin:0 0 16px}
  .psec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
  .psec h4{
    font-size:11px;letter-spacing:.14em;color:var(--ink-3);
    margin:0 0 9px;font-weight:600;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .rows{font-size:13px}
  .rows div{display:flex;gap:8px;padding:3px 0;color:var(--ink-2)}
  .rows span:first-child{color:var(--ink-3);flex:0 0 46px}
  .rows a{border-bottom:1px solid var(--line);transition:border-color .15s}
  .rows a:hover{border-color:var(--accent);color:var(--accent)}
  .stat{display:flex;gap:18px;margin-top:4px}
  .stat div{font-size:12px;color:var(--ink-3)}
  .stat b{display:block;font-size:20px;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}

  /* ---------- 响应式 ---------- */
  @media (max-width:1180px){
    .layout{grid-template-columns:minmax(0,1fr) 300px}
    .nav{grid-column:1 / -1;position:static;margin-bottom:4px}
    .nav-list{display:flex;flex-wrap:wrap;gap:6px}
    .cat{width:auto;margin:0}
    .cat .n{display:none}
  }
  @media (max-width:860px){
    .layout{grid-template-columns:minmax(0,1fr);padding:22px 16px 48px;gap:20px}
    .profile{position:static;order:-1}
    .work-top{grid-template-columns:minmax(0,1fr)}
    .cover{border-right:0;border-bottom:1px solid var(--line-2);min-height:130px}
    .pcard{display:grid;grid-template-columns:78px 1fr;gap:0 16px;align-items:start}
    .avatar{margin:0;grid-row:1 / 3}
    .pname,.ptitle{margin-bottom:2px}
    .pbio{grid-column:1 / -1;margin-top:12px}
    .psec{grid-column:1 / -1}
  }
</style>
</head>
<body>

<div class="layout">

</div>

      summary: "面向新闻传播学生的伦理判断训练工具：六个类型化情境、每个三道判断、即时反馈后果推演与依据方向，单文件、无联网、可离线运行。成品源码尚待重建，现有设计文档与交互截图。",
      workflow: [
        "调研新闻实践中反复出现的伦理困境类型",
        "设计「看似合理实则危险」的干扰项，让错误选择有说服力",
        "用原生 JS 实现单页交互、进度与评分逻辑",
        "对照课程讲义复核全部案例表述，只写依据方向不引条文"
      ],
      tags: ["HTML", "JavaScript", "教育科普", "离线可用"],
      cover: "images/ethics-cover.jpg"
    },
    {
      cat: "tool", title: "Ren'Py 分支自检器",
      year: "2026.10", role: "设计 / 实现 / 测试",
      summary: "给 Ren'Py 视觉小说用的静态检查工具：扫一遍 .rpy，报出断链、孤立标签、重复定义和动态跳转数量，支持 --json 与 --html 报告，单文件无第三方依赖。",
      workflow: [
        "从自己的《代笔》里发现痛点：改错一个跳转要跑到那一幕才报错",
        "用正则抓 label 定义与 jump/call 引用，两个集合做差集",
        "用「标签必须顶格」区分剧本标签与 screen 控件，修掉假阳性",
        "加 --json / --ignore / --html 报告与退出码，能接进流水线",
        "用故意写坏的样本验证报警，用真实项目验证安静"
      ],
      tags: ["Python", "静态分析", "Ren'Py", "开发工具"],
      cover: "",
      link: "https://github.com/windirs-zxy/renpy-checker"
    },
    {
      cat: "wechat", sample: true, title: "校园人物专栏 · 图文排版",
      year: "2025.05", role: "采访 / 撰稿 / 排版",
      summary: "连载十期的人物专栏，统一开头引语格式、段间距与图片比例，把长文阅读体验做顺。",
      workflow: ["确定栏目视觉规范与开头格式", "采访提纲与成稿", "按规范排版并统一图片比例", "发布后统计阅读完成率并迭代版式"],
      tags: ["公众号", "排版", "采写"], cover: ""
    },
    {
      cat: "operation", sample: true, title: "校园账号从 0 到 1 运营复盘",
      year: "2025.07", role: "内容策划 / 数据复盘",
      summary: "接手一个新账号，用三个月把粉丝从零做到四位数，沉淀出一套选题与发布节奏的复盘文档。",
      workflow: ["竞品与受众分析，确定内容方向", "建立选题库与周更排期", "每期记录完播率、互动率与涨粉数", "按数据反馈调整选题配比与发布时间"],
      tags: ["账号运营", "数据分析", "内容策划"], cover: ""
    }
  ];

  /* ===================== 以下为渲染逻辑，通常不用改 ===================== */
  var state = { cat: "all", q: "" };
  var $ = function(id){ return document.getElementById(id); };

  function byId(id){
    for (var i = 0; i < CATEGORIES.length; i++){
      if (CATEGORIES[i].id === id) return CATEGORIES[i];
    }
    return null;
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function counts(){
    var m = {};
    WORKS.forEach(function(w){ m[w.cat] = (m[w.cat] || 0) + 1; });
    return m;
  }

  function renderNav(){
    var c = counts();
    var html = '<button class="cat' + (state.cat === "all" ? " on" : "") + '" data-cat="all">' +
               '<span class="ico">🗂️</span><span class="nm">全部作品</span>' +
               '<span class="n">' + WORKS.length + '</span></button>';
    CATEGORIES.forEach(function(k){
      html += '<button class="cat' + (state.cat === k.id ? " on" : "") + '" data-cat="' + k.id + '">' +
              '<span class="ico">' + k.ico + '</span><span class="nm">' + esc(k.name) + '</span>' +
              '<span class="n">' + (c[k.id] || 0) + '</span></button>';
    });
    $("cats").innerHTML = html;
    Array.prototype.forEach.call($("cats").querySelectorAll(".cat"), function(b){
      b.onclick = function(){ state.cat = b.getAttribute("data-cat"); render(); };
    });
  }

  function match(w){
    if (state.cat !== "all" && w.cat !== state.cat) return false;
    if (!state.q) return true;
    var hay = [w.title, w.summary, w.year, w.role,
               (w.tags || []).join(" "),
               (byId(w.cat) ? byId(w.cat).name : ""),
               (w.workflow || []).join(" ")].join(" ").toLowerCase();
    return hay.indexOf(state.q.toLowerCase()) >= 0;
  }

  function coverHTML(w){
    var k = byId(w.cat);
    // 占位块在下层，图片盖在上层；图片加载失败就把自己移除，占位块自然露出来。
    // 这样避免在 onerror 里拼字符串（作品名含引号时会破坏 HTML）。
    var ph = '<div class="ph"><b>' + esc(w.title) + '</b>' +
             (k ? esc(k.name) : "") + '<br>' +
             (w.cover ? "封面加载失败，检查 cover 路径" : "封面占位 · 图片放进 images/ 后填 cover 字段") +
             '</div>';
    var img = w.cover
      ? '<img src="' + esc(w.cover) + '" alt="' + esc(w.title) + '" onerror="this.remove()">'
      : '';
    return '<div class="cover">' + ph + img + '</div>';
  }

  function workHTML(w){
    var k = byId(w.cat);
    var steps = (w.workflow || []).map(function(s){ return "<li>" + esc(s) + "</li>"; }).join("");
    return '' +
      '<article class="work">' +
        '<div class="work-top">' +
          coverHTML(w) +
          '<div class="work-body">' +
            '<h3>' + esc(w.title) +
              (w.sample ? '<span class="badge">示例</span>' : '') +
              (k ? '<span class="badge cat">' + esc(k.name) + '</span>' : '') +
              (w.link ? ' <a class="badge" href="' + esc(w.link) + '" target="_blank" rel="noopener">查看 ↗</a>' : '') +
            '</h3>' +
            '<p class="summary">' + esc(w.summary) + '</p>' +
            '<div class="metas">' +
              '<span><b>制作时间</b> ' + esc(w.year) + '</span>' +
              '<span><b>参与环节</b> ' + esc(w.role) + '</span>' +
            '</div>' +
            '<div class="tags">' + (w.tags || []).map(function(t){
              return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' +
            (steps ? '<div class="flow"><div class="flow-h">工作流</div><ol class="steps">' + steps + '</ol></div>' : '') +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function render(){
    renderNav();
    var list = WORKS.filter(match);
    var k = byId(state.cat);

    $("head-title").textContent = state.q ? "搜索结果" :
      (state.cat === "all" ? "全部作品" : (k ? k.name : "作品"));
    $("head-desc").textContent = state.q ? ("关键词：" + state.q) :
      (state.cat === "all" ? "按分类浏览，或直接搜索关键词。" :
       (k ? k.desc : ""));

    $("crumb-title").textContent = k ? k.name : "全部";
    $("crumb-count").textContent = list.length + " 件";
    $("crumb-desc").textContent = k ? "· " + k.desc : "";

    $("works").innerHTML = list.length
      ? list.map(workHTML).join("")
      : '<div class="empty">这个分类下还没有作品。<br>在源码的 WORKS 数组里添加一条，把 cat 设为「' +
        esc(state.cat) + '」即可。</div>';
  }

  function renderProfile(){
    var av = PROFILE.avatar
      ? '<img src="' + esc(PROFILE.avatar) + '" alt="' + esc(PROFILE.name) +
        '" onerror="this.remove()">'
      : esc(PROFILE.name.slice(0, 1));
    var rows = (PROFILE.contact || []).filter(function(c){ return c.v; }).map(function(c){
      var v = c.href ? '<a href="' + esc(c.href) + '" target="_blank" rel="noopener">' + esc(c.v) + '</a>'
                     : esc(c.v);
      return '<div><span>' + esc(c.k) + '</span><span>' + v + '</span></div>';
    }).join("");
    var chips = (PROFILE.skills || []).map(function(s){
      return '<span class="chip">' + esc(s) + '</span>'; }).join("");
    var used = CATEGORIES.filter(function(k){ return counts()[k.id]; }).length;

    $("pcard").innerHTML =
      '<div class="avatar">' + av + '</div>' +
      '<h3 class="pname">' + esc(PROFILE.name) + '</h3>' +
      '<p class="ptitle">' + esc(PROFILE.title) + '</p>' +
      '<p class="pbio">' + esc(PROFILE.bio) + '</p>' +
      '<div class="stat">' +
        '<div><b>' + WORKS.length + '</b>件作品</div>' +
        '<div><b>' + used + '</b>个分类</div>' +
      '</div>' +
      '<div class="psec"><h4>技能</h4><div class="chips">' + chips + '</div></div>' +
      '<div class="psec"><h4>联系</h4><div class="rows">' + rows + '</div></div>';
  }

  var q = $("q");
  q.oninput = function(){ state.q = q.value.trim(); render(); };
  document.addEventListener("keydown", function(e){
    if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
    if (e.key === "Escape" && document.activeElement === q){ q.value = ""; state.q = ""; q.blur(); render(); }
  });

  renderProfile();
  render();
})();
</script>
</body>
</html>
